<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Carregar...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .container {
      text-align: center;
      max-width: 500px;
    }
    
    .spinner {
      width: 80px;
      height: 80px;
      border: 6px solid #E1E8ED;
      border-top: 6px solid #2C3E50;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 2rem;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    h1 {
      font-size: 1.8rem;
      color: #2C3E50;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    
    p {
      font-size: 1.1rem;
      color: #7F8C8D;
      line-height: 1.6;
    }
    
    .dots {
      display: inline-block;
      width: 20px;
    }
    
    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }
    
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
    
    @media (max-width: 768px) {
      .spinner {
        width: 60px;
        height: 60px;
      }
      
      h1 {
        font-size: 1.5rem;
      }
      
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>A Carregar<span class="dots"></span></h1>
    <p>Por favor aguarde enquanto preparamos tudo para si.</p>
  </div>
  
  <script>
    // Redirecionar para home após 3 segundos se não for redirecionado antes
    setTimeout(() => {
      if (window.location.pathname === '/loading.html') {
        window.location.href = '/';
      }
    }, 3000);
  </script>
</body>
</html>
