<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Não Encontrada</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .container {
      text-align: center;
      max-width: 600px;
    }
    
    .error-code {
      font-size: 8rem;
      font-weight: 800;
      color: #2C3E50;
      line-height: 1;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }
    
    h1 {
      font-size: 2rem;
      color: #2C3E50;
      margin-bottom: 1rem;
      font-weight: 700;
    }
    
    p {
      font-size: 1.1rem;
      color: #7F8C8D;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    
    .btn-home {
      display: inline-block;
      padding: 1rem 2.5rem;
      background-color: #2C3E50;
      color: white;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    
    .btn-home:hover {
      background-color: #34495e;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }
    
    .illustration {
      margin-bottom: 2rem;
      opacity: 0.8;
    }
    
    @media (max-width: 768px) {
      .error-code {
        font-size: 5rem;
      }
      
      h1 {
        font-size: 1.5rem;
      }
      
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="illustration">
      <svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="80" fill="#E1E8ED"/>
        <path d="M70 85C70 77.268 76.268 71 84 71C91.732 71 98 77.268 98 85" stroke="#2C3E50" stroke-width="6" stroke-linecap="round"/>
        <path d="M102 85C102 77.268 108.268 71 116 71C123.732 71 130 77.268 130 85" stroke="#2C3E50" stroke-width="6" stroke-linecap="round"/>
        <path d="M70 130C70 130 85 115 100 115C115 115 130 130 130 130" stroke="#2C3E50" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>
    
    <div class="error-code">404</div>
    <h1>Página Não Encontrada</h1>
    <p>Desculpe, a página que procura não existe ou foi movida para outro local.</p>
    <a href="/" class="btn-home">Voltar ao Início</a>
  </div>
</body>
</html>
