<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Consultorio de Psicologia</title>
  <link rel="stylesheet" href="../public/adds/styles.css">
  <script src="../public/adds/loader.js"></script>
</head>
<body>
  <div id="header-container"></div>

  <main>
    <div class="form-container" id="loginForm">
      <h2>Acesso a Conta</h2>
      
      <div id="alert" class="alert-hidden"></div>

      <div class="form-group">
        <label>Utilizador</label>
        <input type="text" id="username" placeholder="Digite o seu username" required>
      </div>

      <div class="form-group">
        <label>Palavra-passe</label>
        <input type="password" id="password" placeholder="Sua senha" required>
        
        <label class="checkbox-label">
          <input type="checkbox" onclick="togglePassword()"> 
          Mostrar palavra-passe
        </label>
      </div>

      <button class="btn btn-full-width" onclick="login()">Entrar</button>

      <p class="text-center spacing-top">
        Nao tem conta? <a href="#" onclick="mostrarRegistro()" class="link-primary">Criar conta agora</a>
      </p>
    </div>

    <div class="form-container" id="registroForm" style="display: none;">
      <h2>Nova Conta</h2>
      <div id="alertRegistro" class="alert-hidden"></div>

      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="regNome" placeholder="Nome completo">
      </div>
      
      <div class="form-group">
        <label>Primeiro Nome</label>
        <input type="text" id="regPrimeiroNome" placeholder="Primeiro nome">
      </div>
      
      <div class="form-group">
        <label>Ultimo Nome</label>
        <input type="text" id="regUltimoNome" placeholder="Ultimo nome">
      </div>
      
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="regUsername" placeholder="Username pretendido">
      </div>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="exemplo@email.com">
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Crie uma senha">
      </div>
      
      <div class="form-group">
        <label>Genero</label>
        <select id="regGenero">
          <option value="">Selecione</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
          <option value="Outro">Outro</option>
          <option value="Prefiro nao dizer">Prefiro nao dizer</option>
        </select>
      </div>

      <button class="btn btn-full-width" onclick="registrar()">Finalizar Registro</button>
      
      <p class="text-center spacing-top-small">
        <a href="#" onclick="mostrarLogin()" class="link-secondary">Ja tenho conta. Voltar</a>
      </p>
    </div>
  </main>

  <div id="footer-container"></div>

  <script>
    function togglePassword() {
      const p = document.getElementById('password');
      p.type = p.type === 'password' ? 'text' : 'password';
    }

    function mostrarRegistro() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registroForm').style.display = 'block';
    }

    function mostrarLogin() {
      document.getElementById('registroForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    }

    function mostrarAlerta(msg, tipo, elementId = 'alert') {
      const el = document.getElementById(elementId);
      el.textContent = msg;
      el.className = tipo === 'error' ? 'alert alert-error' : 'alert alert-success';
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!username || !password) {
        mostrarAlerta('Por favor, preencha todos os campos.', 'error');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          mostrarAlerta('Login efetuado com sucesso!', 'success');
          localStorage.setItem('user', JSON.stringify(data.user));
          
          setTimeout(() => {
            if (data.user.role === 'admin') {
              window.location.href = '../public/admin/dashboard.html';
            } else {
              window.location.href = '../public/client/dashboard.html';
            }
          }, 800);
        } else {
          mostrarAlerta(data.error || 'Credenciais invalidas', 'error');
        }
      } catch (error) {
        mostrarAlerta('Erro ao conectar ao servidor. Verifique a sua ligacao.', 'error');
      }
    }

    async function registrar() {
      const nome = document.getElementById('regNome').value;
      const primeiroNome = document.getElementById('regPrimeiroNome').value;
      const ultimoNome = document.getElementById('regUltimoNome').value;
      const username = document.getElementById('regUsername').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const genero = document.getElementById('regGenero').value;

      if (!nome || !username || !email || !password) {
        mostrarAlerta('Preencha os campos obrigatorios.', 'error', 'alertRegistro');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, primeiroNome, ultimoNome, username, email, password, genero })
        });

        if (res.ok) {
          mostrarAlerta('Conta criada com sucesso!', 'success', 'alertRegistro');
          setTimeout(() => mostrarLogin(), 1500);
        } else {
          const data = await res.json();
          mostrarAlerta(data.error, 'error', 'alertRegistro');
        }
      } catch (e) {
        mostrarAlerta('Erro na ligacao ao servidor.', 'error', 'alertRegistro');
      }
    }
  </script>
</body>
</html>
