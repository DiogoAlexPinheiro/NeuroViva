<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Consultorio de Psicologia</title>
  <link rel="stylesheet" href="./styles/login.css">
</head>
<body>
  <header>
    <h1><span class="brand">NEUROVIVA</span></h1>
  </header>

  <nav>
    <a href="./index.html">Início</a>
    <a href="./login.html" class="active">Login</a>
  </nav>

  <main>
    <div class="form-container" id="loginForm">
      <h2>Acesso a Conta</h2>
      
      <div id="alert" class="alert-hidden"></div>

      <div class="form-group">
        <label>Utilizador</label>
        <input type="text" id="username" placeholder="Digite o seu username" required>
      </div>

      <div class="form-group">
        <label>Palavra-passe</label>
        <input type="password" id="password" placeholder="Sua senha" required>
        
        <label class="checkbox-label">
          <input type="checkbox" onclick="togglePassword()"> 
          Mostrar palavra-passe
        </label>
      </div>

      <button class="btn btn-full-width" onclick="login()">Entrar</button>

      <p class="text-center spacing-top">
        Não tem conta? <a href="#" onclick="mostrarRegistro()" class="link-primary">Criar conta agora</a>
      </p>
    </div>

    <div class="form-container" id="registroForm" style="display: none;">
      <h2>Nova Conta</h2>
      <div id="alertRegistro" class="alert-hidden"></div>

      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="regNome" placeholder="Nome completo">
      </div>
      
      <div class="form-group">
        <label>Primeiro Nome</label>
        <input type="text" id="regPrimeiroNome" placeholder="Primeiro nome">
      </div>
      
      <div class="form-group">
        <label>Ultimo Nome</label>
        <input type="text" id="regUltimoNome" placeholder="Ultimo nome">
      </div>
      
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="regUsername" placeholder="Username">
      </div>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="exemplo@email.com">
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Password">
      </div>
      
      <div class="form-group">
        <label>Género</label>
        <select id="regGenero">
          <option value="">Selecione</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
          <option value="Outro">Outro</option>
          <option value="Prefiro não dizer">Prefiro não dizer</option>
        </select>
      </div>

      <button class="btn btn-full-width" onclick="registrar()">Finalizar Registro</button>
      
      <p class="text-center spacing-top-small">
        <a href="#" onclick="mostrarLogin()" class="link-secondary">Já tenho conta. Voltar</a>
      </p>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Consultorio NeuroViva. Todos os direitos reservados.</p>
  </footer>
  <script src="./scripts/login.js"></script>
</body>
</html>
