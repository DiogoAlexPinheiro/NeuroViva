<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Mensagens - Cliente</title>
  <link rel="stylesheet" href="../../styles/client/mensagens.css">
  <script src="https://unpkg.com/i18next@23.10.1/dist/umd/i18next.min.js"></script>
  <script src="../../scripts/i18n.js"></script>
</head>
<body>
  <div class="top-bar">
    <header>
      <h1><span class="brand">NEUROVIVA</span> <span class="area" data-i18n="area_cliente">- Área Cliente</span></h1>

      <div class="lang-switch">
        <button onclick="mudarLingua('pt')" title="Português">
          <img src="../../../assets/images/flag_pt.png" alt="PT">
        </button>
        <button onclick="mudarLingua('en')" title="English">
          <img src="../../../assets/images/flag_uk.png" alt="EN">
        </button>
      </div>
    </header>

    <nav>
      <div class="user-nav-wrapper">
        <span id="userName">Olá, Cliente</span>
        
        <div class="nav-links-center">
          <a href="../client/dashboard.html" data-page="dashboard">Dashboard</a>
          <a href="../client/agendamentos.html" data-page="agendamentos" data-i18n="agendamentos">Agendamentos</a>
          <a href="../client/mensagens.html" data-page="mensagens" data-i18n="mensagens" class="nav-btn pressed">Mensagens</a>
          <a href="../client/financeiro.html" data-page="financeiro" data-i18n="financeiro">Financeiro</a>
          <a href="../client/perfil.html" data-page="perfil" data-i18n="perfil">Perfil</a>
        </div>

        <button class="btn-outline" onclick="logout()" style="padding: 0.6rem 1.5rem; font-size: 0.9rem;" data-i18n="sair">Sair</button>
      </div>
    </nav>
  </div>

  <main>
    <h2 data-i18n="centro_mensagens">Centro de Mensagens</h2>
    <div id="alert" style="display:none; padding:1rem; border-radius:12px; margin-bottom:1rem;"></div>

    <div class="card">
      <h3 data-i18n="nova_mensagem">Nova Mensagem</h3>
      <form id="formMensagem" enctype="multipart/form-data">
        <div class="form-group">
          <label data-i18n="assunto">Assunto</label>
          <input type="text" id="novoAssunto" data-i18n-placeholder="sobre_falar" placeholder="Sobre o que quer falar?" required>
        </div>
        <div class="form-group">
          <label data-i18n="mensagem">Mensagem</label>
          <textarea id="novoTexto" rows="4" data-i18n-placeholder="placeholder_escreva_mensagem" placeholder="Escreva a sua mensagem aqui..." required></textarea>
        </div>
        <div class="form-group">
          <label data-i18n="imagem_opcional">Imagem (opcional)</label>
          <input type="file" id="imagemInput" accept="image/png,image/jpeg,image/jpg" class="btn-small btn-outline">
          <small data-i18n="apenas_png">Apenas PNG e JPG - Max 1 imagem</small>
        </div>
        <button type="button" class="btn-solid" onclick="enviarMensagem()" data-i18n="enviar_mensagem">Enviar Mensagem</button>
      </form>
    </div>

    <div id="contentorMensagens"></div>

    <div id="modalEditar" class="modal-overlay">
      <div class="modal-content">
        <h3 data-i18n="editar_mensagem">Editar Mensagem</h3>
        <div class="form-group">
          <label data-i18n="assunto">Assunto</label>
          <input type="text" id="editAssunto" required>
        </div>
        <div class="form-group">
          <label data-i18n="mensagem">Mensagem</label>
          <textarea id="editTexto" rows="4" required></textarea>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 1rem;">
          <button class="btn-solid" onclick="salvarEdicao()" data-i18n="guardar">Guardar</button>
          <button class="btn-outline" onclick="fecharModal()" data-i18n="cancelar">Cancelar</button>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p data-i18n="footer-cliente">&copy; 2025 Consultorio NeuroViva. Todos os direitos reservados.</p>
  </footer>

  <script src="../../scripts/client/mensagens.js">
  </script>
</body>
</html>
