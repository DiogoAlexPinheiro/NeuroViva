<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagens - Admin</title>
  <link rel="stylesheet" href="../../styles/admin/mensagens.css">
  <script src="https://unpkg.com/i18next@23.10.1/dist/umd/i18next.min.js"></script>
  <script src="../../scripts/i18n.js"></script>
</head>
<body>
  <div class="top-bar">
    <header>
      <h1><span class="brand">NEUROVIVA</span> <span class="area" data-i18n="area_admin">- Área Admin</span></h1>

      <div class="lang-switch">
        <button onclick="mudarLingua('pt')" title="Português">
          <img src="../../../assets/images/flag_pt.png" alt="PT">
        </button>
        <button onclick="mudarLingua('en')" title="English">
          <img src="../../../assets/images/flag_uk.png" alt="EN">
        </button>
      </div>
    </header>

    <nav>
      <div class="user-nav-wrapper">
        <span id="userName">Admin</span>
        
        <div class="nav-links-center">
          <a href="../admin/dashboard.html" data-page="dashboard">Dashboard</a>
          <a href="../admin/pacientes.html" data-page="pacientes" data-i18n="pacientes">Pacientes</a>
          <a href="../admin/agendamentos.html" data-page="agendamentos" data-i18n="agendamentos">Agendamentos</a>
          <a href="../admin/mensagens.html" data-page="mensagens" data-i18n="mensagens">Mensagens</a>
          <a href="../admin/relatorios.html" data-page="relatorios" data-i18n="relatorios">Relatórios</a>
          <a href="../admin/financeiro.html" data-page="financeiro" data-i18n="financeiro">Financeiro</a>
          <a href="../admin/perfil.html" data-page="perfil" data-i18n="perfil">Perfil</a>
        </div>

        <button class="btn-outline" onclick="logout()" style="padding: 0.6rem 1.5rem; font-size: 0.9rem;" data-i18n="sair">Sair</button>
      </div>
    </nav>
  </div>

  <main>
    <h2 data-i18n="centro_mensagens">Centro de Mensagens</h2>

    <div class="mensagens-container">
      <!-- Sidebar de Clientes -->
      <div class="clientes-sidebar">
        <div class="clientes-header">
          <div class="clientes-header-title">
            <span data-i18n="conversas">Conversas</span>
          </div>

          <div class="sidebar-actions">
            <button class="btn-compact" type="button" onclick="ativarMensagemGeral()" title="Enviar mensagem para todos os clientes">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
              </svg>
              <span data-i18n="mensagem_geral">Geral</span>
            </button>
          </div>
        </div>

        <div class="clientes-search">
          <input type="text" id="searchClientes" data-i18n-placeholder="procurar_cliente" placeholder="Procurar cliente" onkeyup="filtrarClientes()">
        </div>

        <div class="clientes-lista" id="clientesLista">
          <p class="loading-state" data-i18n="a_carregar">A carregar</p>
        </div>
      </div>

      <!-- Área de Chat -->
      <div class="chat-area" id="chatArea">
        <div class="empty-state">
          <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
          <h3 data-i18n="selecionar_cliente">Selecione um cliente</h3>
          <p data-i18n="escolher_conversa">Escolha uma conversa para enviar mensagens</p>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p data-i18n="footer_admin">&copy; 2025 Consultório NeuroViva - Painel Administrativo</p>
  </footer>

  <script src="../../scripts/admin/mensagens.js"></script>
</body>
</html>
