<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Paciente - Admin</title>
  <link rel="stylesheet" href="../../styles/admin/pacientes.css">
</head>
<body>
  <header>
    <h1><span class="brand">NEUROVIVA</span> <span class="area">- Área Cliente</span></h1>
  </header>

  <nav>
    <div class="user-nav-wrapper">
      <span id="userName">Admin</span>
      
      <div class="nav-links-center">
        <a href="../admin/dashboard.html" data-page="dashboard">Dashboard</a>
        <a href="../admin/pacientes.html" data-page="pacientes">Pacientes</a>
        <a href="../admin/agendamentos.html" data-page="agendamentos">Agendamentos</a>
        <a href="../admin/mensagens.html" data-page="mensagens">Mensagens</a>
        <a href="../admin/relatorios.html" data-page="relatorios">Relatórios</a>
        <a href="../admin/financeiro.html" data-page="financeiro">Financeiro</a>
        <a href="../admin/perfil.html" data-page="perfil">Perfil</a>
      </div>

      <button class="btn-outline" onclick="logout()" style="padding: 0.6rem 1.5rem; font-size: 0.9rem;">Sair</button>
    </div>
  </nav>

  <main>
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <a href="../admin/pacientes.html" class="btn-secondary">← Voltar para Pacientes</a>
    </div>

    <h2 style="text-align: center;">Criar Novo Paciente</h2>

    <div id="alert" class="alert-hidden"></div>

    <div class="card">
      <h3>Dados de Acesso</h3>
      
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Username para login">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="email@exemplo.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Senha inicial">
      </div>
    </div>

    <div class="card">
      <h3>Dados Pessoais</h3>
      
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="nomeCompleto" placeholder="Nome completo do paciente">
      </div>

      <div class="form-group">
        <label>Primeiro Nome</label>
        <input type="text" id="primeiroNome" placeholder="Primeiro nome">
      </div>

      <div class="form-group">
        <label>Ultimo Nome</label>
        <input type="text" id="ultimoNome" placeholder="Ultimo nome">
      </div>

      <div class="form-group">
        <label>Genero</label>
        <select id="genero">
          <option value="">Selecione</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
          <option value="Outro">Outro</option>
          <option value="Prefiro nao dizer">Prefiro nao dizer</option>
        </select>
      </div>

      <div class="form-group">
        <label>Contacto</label>
        <input type="text" id="contacto" placeholder="912345678">
      </div>

      <div class="form-group">
        <label>Morada</label>
        <input type="text" id="morada" placeholder="Rua, numero, localidade">
      </div>

      <div class="form-group">
        <label>Idade</label>
        <input type="number" id="idade" min="0" placeholder="Idade">
      </div>

      <div class="form-group">
        <label>Profissao</label>
        <input type="text" id="profissao" placeholder="Profissao">
      </div>

      <div class="form-group">
        <label>Numero de Identificacao</label>
        <input type="text" id="numeroIdentificacao" placeholder="CC/BI">
      </div>
    </div>

    <button class="btn btn-centered" onclick="criarPaciente()">Criar Paciente</button>
  </main>

  <footer>
    <p>&copy; 2025 Consultório NeuroViva - Painel Administrativo</p>
  </footer>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    
    if (!user || user.role !== 'admin') {
      window.location.href = '../login.html';
    }

    async function criarPaciente() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const nomeCompleto = document.getElementById('nomeCompleto').value.trim();
      const primeiroNome = document.getElementById('primeiroNome').value.trim();
      const ultimoNome = document.getElementById('ultimoNome').value.trim();
      const genero = document.getElementById('genero').value;
      const contacto = document.getElementById('contacto').value.trim();
      const morada = document.getElementById('morada').value.trim();
      const idade = document.getElementById('idade').value;
      const profissao = document.getElementById('profissao').value.trim();
      const numeroIdentificacao = document.getElementById('numeroIdentificacao').value.trim();

      if (!username || !email || !password || !nomeCompleto) {
        mostrarAlerta('Preencha os campos obrigatorios (username, email, password, nome completo)', 'error');
        return;
      }

      try {
        const res = await fetch('http://localhost:3000/api/admin/pacientes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            email,
            password,
            nomeCompleto,
            primeiroNome,
            ultimoNome,
            genero,
            contacto,
            morada,
            idade,
            profissao,
            numeroIdentificacao
          })
        });

        const result = await res.json();

        if (res.ok) {
          mostrarAlerta('Paciente criado com sucesso!', 'success');
          setTimeout(() => {
            window.location.href = '../admin/pacientes.html';
          }, 1500);
        } else {
          mostrarAlerta(result.error, 'error');
        }
      } catch (error) {
        mostrarAlerta('Erro ao criar paciente', 'error');
      }
    }

    function mostrarAlerta(msg, tipo) {
      const el = document.getElementById('alert');
      el.className = tipo === 'error' ? 'alert alert-error' : 'alert alert-success';
      el.textContent = msg;
      setTimeout(() => el.className = 'alert-hidden', 5000);
    }
 
    // Carregar HTML dos modais quando o DOM estiver pronto
    document.addEventListener('DOMContentLoaded', function() {
      // Criar container para os modais se não existir
      if (!document.getElementById('customModalOverlay')) {
        const modalHTML = `
          <div id="customModalOverlay" class="custom-modal-overlay">
            <div class="custom-modal-content">
              <div class="custom-modal-header">
                <h3 id="customModalTitle">Confirmação</h3>
              </div>
              <div class="custom-modal-body">
                <p id="customModalMessage"></p>
              </div>
              <div class="custom-modal-footer">
                <button id="customModalCancel" class="btn-secondary">Cancelar</button>
                <button id="customModalConfirm" class="btn">Confirmar</button>
              </div>
            </div>
          </div>

          <div id="customAlertOverlay" class="custom-modal-overlay">
            <div class="custom-modal-content custom-modal-alert">
              <div class="custom-modal-body">
                <p id="customAlertMessage"></p>
              </div>
              <div class="custom-modal-footer">
                <button id="customAlertOk" class="btn">OK</button>
              </div>
            </div>
          </div>

          <div id="loadingOverlay" class="loading-overlay">
            <div class="loading-spinner"></div>
            <p id="loadingMessage">A processar...</p>
          </div>
        `;
        
        document.body.insertAdjacentHTML('beforeend', modalHTML);
      }
    });

    // ============================================
    // FUNÇÃO CUSTOM CONFIRM
    // ============================================
    function customConfirm(message, title = 'Confirmação') {
      return new Promise((resolve) => {
        const overlay = document.getElementById('customModalOverlay');
        const messageEl = document.getElementById('customModalMessage');
        const titleEl = document.getElementById('customModalTitle');
        const confirmBtn = document.getElementById('customModalConfirm');
        const cancelBtn = document.getElementById('customModalCancel');

        if (!overlay || !messageEl || !confirmBtn || !cancelBtn) {
          // Fallback para confirm nativo se modal não existir
          resolve(confirm(message));
          return;
        }

        titleEl.textContent = title;
        messageEl.textContent = message;
        overlay.style.display = 'flex';

        const handleConfirm = () => {
          overlay.style.display = 'none';
          cleanup();
          resolve(true);
        };

        const handleCancel = () => {
          overlay.style.display = 'none';
          cleanup();
          resolve(false);
        };

        const cleanup = () => {
          confirmBtn.removeEventListener('click', handleConfirm);
          cancelBtn.removeEventListener('click', handleCancel);
        };

        confirmBtn.addEventListener('click', handleConfirm);
        cancelBtn.addEventListener('click', handleCancel);
      });
    }

    // ============================================
    // FUNÇÃO CUSTOM ALERT
    // ============================================
    function customAlert(message) {
      return new Promise((resolve) => {
        const overlay = document.getElementById('customAlertOverlay');
        const messageEl = document.getElementById('customAlertMessage');
        const okBtn = document.getElementById('customAlertOk');

        if (!overlay || !messageEl || !okBtn) {
          // Fallback para alert nativo se modal não existir
          alert(message);
          resolve();
          return;
        }

        // Suportar quebras de linha
        messageEl.innerHTML = message.replace(/\n/g, '<br>');
        overlay.style.display = 'flex';

        const handleOk = () => {
          overlay.style.display = 'none';
          okBtn.removeEventListener('click', handleOk);
          resolve();
        };

        okBtn.addEventListener('click', handleOk);
      });
    }

    // ============================================
    // FUNÇÕES DE LOADING
    // ============================================
    function showLoading(message = 'A processar...') {
      const overlay = document.getElementById('loadingOverlay');
      const messageEl = document.getElementById('loadingMessage');
      
      if (overlay && messageEl) {
        messageEl.textContent = message;
        overlay.style.display = 'flex';
      }
    }

    function hideLoading() {
      const overlay = document.getElementById('loadingOverlay');
      
      if (overlay) {
        overlay.style.display = 'none';
      }
    }

    // Tornar funções globais
    window.customConfirm = customConfirm;
    window.customAlert = customAlert;
    window.showLoading = showLoading;
    window.hideLoading = hideLoading;

    // public/admin/adds/loader.js
    async function loadComponent(elementId, file) {
      try {
        const response = await fetch(file);
        const html = await response.text();
        document.getElementById(elementId).innerHTML = html;
      } catch (error) {
        console.error(`Erro ao carregar ${file}:`, error);
      }
    }

    async function carregarNotificacoes() {
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user) return;

      try {
        const res = await fetch('http://localhost:3000/api/notificacoes/admin');
        const notif = await res.json();

        const badgeMensagens = document.getElementById('badgeMensagens');
        const badgePagamentos = document.getElementById('badgePagamentos');

        if (badgeMensagens) {
          badgeMensagens.textContent = notif.mensagens;
          badgeMensagens.className = notif.mensagens > 0 ? 'notification-badge' : 'notification-badge zero';
        }

        if (badgePagamentos) {
          badgePagamentos.textContent = notif.pagamentos;
          badgePagamentos.className = notif.pagamentos > 0 ? 'notification-badge' : 'notification-badge zero';
        }
      } catch (error) {
        console.error('Erro ao carregar notificações:', error);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await loadComponent('header-container', '../admin/adds/header.html');
      await loadComponent('footer-container', '../admin/adds/footer.html');
      
      setTimeout(() => {
        const user = JSON.parse(localStorage.getItem('user'));
        if (user) {
          const userNameEl = document.getElementById('userName');
          if (userNameEl) userNameEl.textContent = user.nome;
        }
        
        carregarNotificacoes();
        setInterval(carregarNotificacoes, 30000);
      }, 100);
    });

    function logout() {
      localStorage.removeItem('user');
      window.location.href = '/login.html';
    }
  </script>
</body>
</html>
