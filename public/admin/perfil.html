<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - Admin</title>
  <link rel="stylesheet" href="../admin/adds/admin.css">
  <script src="../admin/adds/loader.js"></script>
</head>
<body>
  <div id="header-container"></div>

  <main>
    <h2>Meu Perfil</h2>

    <div id="alert" class="alert-hidden"></div>

    <div class="card card-profile">
      <h3>Foto de Perfil</h3>
      
      <div class="profile-section">
        <img id="previewImage" src="/assets/images/profiles/default.jpg" alt="Foto de perfil" class="profile-image-large">
        <input type="file" id="profileImageInput" accept="image/png,image/jpeg,image/jpg" class="btn-small btn-outline" style="display: none;">
        <button class="btn-small btn-outline" onclick="document.getElementById('profileImageInput').click()">Escolher Foto</button>
      </div>
    </div>

    <div class="card card-profile">
      <h3>Informacoes Pessoais</h3>
      
      <div class="form-group">
        <label>Nome Completo</label>
        <input type="text" id="nome">
      </div>

      <div class="form-group">
        <label>Primeiro Nome</label>
        <input type="text" id="primeiroNome">
      </div>

      <div class="form-group">
        <label>Ultimo Nome</label>
        <input type="text" id="ultimoNome">
      </div>

      <div class="form-group">
        <label>Genero</label>
        <select id="genero">
          <option value="">Selecione</option>
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
          <option value="Outro">Outro</option>
          <option value="Prefiro nao dizer">Prefiro nao dizer</option>
        </select>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email">
      </div>

      <div class="form-group">
        <label>Nova Password (deixe vazio para manter)</label>
        <input type="password" id="password">
      </div>
    </div>

    <div class="card card-profile">
      <h3>Horario de Atendimento</h3>
      <p class="card-description">Defina os seus horarios de trabalho para cada dia da semana</p>
      
      <div class="horario-editor">
        <div class="horario-day">
          <label>
            <input type="checkbox" id="segunda-ativo" onchange="toggleDia('segunda')">
            Segunda-feira
          </label>
          <div class="horario-inputs" id="segunda-inputs">
            <input type="time" id="segunda-inicio" value="09:00">
            <span>ate</span>
            <input type="time" id="segunda-fim" value="17:00">
          </div>
        </div>

        <div class="horario-day">
          <label>
            <input type="checkbox" id="terca-ativo" onchange="toggleDia('terca')">
            Terca-feira
          </label>
          <div class="horario-inputs" id="terca-inputs">
            <input type="time" id="terca-inicio" value="09:00">
            <span>ate</span>
            <input type="time" id="terca-fim" value="17:00">
          </div>
        </div>

        <div class="horario-day">
          <label>
            <input type="checkbox" id="quarta-ativo" onchange="toggleDia('quarta')">
            Quarta-feira
          </label>
          <div class="horario-inputs" id="quarta-inputs">
            <input type="time" id="quarta-inicio" value="09:00">
            <span>ate</span>
            <input type="time" id="quarta-fim" value="17:00">
          </div>
        </div>

        <div class="horario-day">
          <label>
            <input type="checkbox" id="quinta-ativo" onchange="toggleDia('quinta')">
            Quinta-feira
          </label>
          <div class="horario-inputs" id="quinta-inputs">
            <input type="time" id="quinta-inicio" value="09:00">
            <span>ate</span>
            <input type="time" id="quinta-fim" value="17:00">
          </div>
        </div>

        <div class="horario-day">
          <label>
            <input type="checkbox" id="sexta-ativo" onchange="toggleDia('sexta')">
            Sexta-feira
          </label>
          <div class="horario-inputs" id="sexta-inputs">
            <input type="time" id="sexta-inicio" value="09:00">
            <span>ate</span>
            <input type="time" id="sexta-fim" value="17:00">
          </div>
        </div>

        <div class="horario-day">
          <label>
            <input type="checkbox" id="sabado-ativo" onchange="toggleDia('sabado')">
            Sabado
          </label>
          <div class="horario-inputs" id="sabado-inputs">
            <input type="time" id="sabado-inicio" value="09:00">
            <span>ate</span>
            <input type="time" id="sabado-fim" value="13:00">
          </div>
        </div>

        <div class="horario-day">
          <label>
            <input type="checkbox" id="domingo-ativo" onchange="toggleDia('domingo')">
            Domingo
          </label>
          <div class="horario-inputs" id="domingo-inputs">
            <input type="time" id="domingo-inicio" value="09:00">
            <span>ate</span>
            <input type="time" id="domingo-fim" value="13:00">
          </div>
        </div>
      </div>
    </div>

    <div class="card card-profile">
      <h3>Dias Livres</h3>
      <p class="card-description">Datas especificas em que nao estara disponivel</p>
      
      <div class="form-group">
        <label>Adicionar Dia Livre</label>
        <input type="date" id="novoDiaLivre">
        <button class="btn" onclick="adicionarDiaLivre()">Adicionar</button>
      </div>

      <div id="listaDiasLivres"></div>
    </div>

    <button class="btn btn-centered" onclick="salvarPerfil()">Salvar Alteracoes</button>
  </main>

  <div id="footer-container"></div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    
    if (!user || user.role !== 'admin') {
      window.location.href = '../login.html';
    }

    let diasLivres = [];
    let profileImageFile = null;

    const diasSemana = ['segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado', 'domingo'];

    // Preview da imagem
    document.getElementById('profileImageInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        profileImageFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('previewImage').src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    function toggleDia(dia) {
      const checkbox = document.getElementById(`${dia}-ativo`);
      const inputs = document.getElementById(`${dia}-inputs`);
      
      if (checkbox.checked) {
        inputs.style.display = 'flex';
      } else {
        inputs.style.display = 'none';
      }
    }

    async function carregarPerfil() {
      try {
        const res = await fetch(`http://localhost:3000/api/admin/perfil?username=${user.username}`);
        const admin = await res.json();

        document.getElementById('nome').value = admin.nome || '';
        document.getElementById('primeiroNome').value = admin.primeiroNome || '';
        document.getElementById('ultimoNome').value = admin.ultimoNome || '';
        document.getElementById('genero').value = admin.genero || '';
        document.getElementById('email').value = admin.email || '';
        
        if (admin.profileImage) {
          document.getElementById('previewImage').src = admin.profileImage;
        }

        if (admin.horario) {
          diasSemana.forEach(dia => {
            const horarioDia = admin.horario[dia] || [];
            const checkbox = document.getElementById(`${dia}-ativo`);
            const inputs = document.getElementById(`${dia}-inputs`);
            
            if (horarioDia.length > 0) {
              checkbox.checked = true;
              inputs.style.display = 'flex';
              document.getElementById(`${dia}-inicio`).value = horarioDia[0];
              document.getElementById(`${dia}-fim`).value = horarioDia[1];
            } else {
              checkbox.checked = false;
              inputs.style.display = 'none';
            }
          });
        }

        diasLivres = admin.diasLivres || [];
        renderizarDiasLivres();
      } catch (error) {
        mostrarAlerta('Erro ao carregar perfil', 'error');
      }
    }

    async function salvarPerfil() {
      const nome = document.getElementById('nome').value;
      const primeiroNome = document.getElementById('primeiroNome').value;
      const ultimoNome = document.getElementById('ultimoNome').value;
      const genero = document.getElementById('genero').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const horario = {};
      diasSemana.forEach(dia => {
        const checkbox = document.getElementById(`${dia}-ativo`);
        if (checkbox.checked) {
          const inicio = document.getElementById(`${dia}-inicio`).value;
          const fim = document.getElementById(`${dia}-fim`).value;
          horario[dia] = [inicio, fim];
        } else {
          horario[dia] = [];
        }
      });

      try {
        const formData = new FormData();
        formData.append('username', user.username);
        formData.append('nome', nome);
        formData.append('primeiroNome', primeiroNome);
        formData.append('ultimoNome', ultimoNome);
        formData.append('genero', genero);
        formData.append('email', email);
        if (password) formData.append('password', password);
        formData.append('horario', JSON.stringify(horario));
        formData.append('diasLivres', JSON.stringify(diasLivres));
        if (profileImageFile) {
          formData.append('profileImage', profileImageFile);
        }

        const res = await fetch('http://localhost:3000/api/admin/perfil', {
          method: 'PUT',
          body: formData
        });

        const result = await res.json();

        if (res.ok) {
          mostrarAlerta('Perfil atualizado!', 'success');
          user.nome = nome;
          user.primeiroNome = primeiroNome;
          user.genero = genero;
          localStorage.setItem('user', JSON.stringify(user));
          document.getElementById('password').value = '';
          
          setTimeout(() => location.reload(), 1000);
        } else {
          mostrarAlerta(result.error, 'error');
        }
      } catch (error) {
        mostrarAlerta('Erro ao atualizar perfil', 'error');
      }
    }

    function adicionarDiaLivre() {
      const data = document.getElementById('novoDiaLivre').value;
      
      if (!data) {
        mostrarAlerta('Selecione uma data', 'error');
        return;
      }

      if (diasLivres.includes(data)) {
        mostrarAlerta('Esta data ja esta adicionada', 'error');
        return;
      }

      diasLivres.push(data);
      diasLivres.sort();
      renderizarDiasLivres();
      document.getElementById('novoDiaLivre').value = '';
    }

    function removerDiaLivre(data) {
      diasLivres = diasLivres.filter(d => d !== data);
      renderizarDiasLivres();
    }

    function renderizarDiasLivres() {
      const container = document.getElementById('listaDiasLivres');
      
      if (diasLivres.length === 0) {
        container.innerHTML = '<p>Sem dias livres definidos</p>';
        return;
      }

      container.innerHTML = `
        <div class="dias-livres-list">
          ${diasLivres.map(d => `
            <div class="dia-livre-item">
              <span>${d}</span>
              <button class="btn-small btn-danger" onclick="removerDiaLivre('${d}')">Remover</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function mostrarAlerta(msg, tipo) {
      const el = document.getElementById('alert');
      el.className = tipo === 'error' ? 'alert alert-error' : 'alert alert-success';
      el.textContent = msg;
      setTimeout(() => el.className = 'alert-hidden', 5000);
    }

    carregarPerfil();
  </script>
</body>
</html>
