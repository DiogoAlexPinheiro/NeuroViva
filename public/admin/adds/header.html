<header>
  <h1><span class="brand">NEUROVIVA</span> <span class="area">- Área Admin</span></h1>
</header>

<nav>
  <div class="user-nav-wrapper">
    <span id="userName">Admin</span>
    
    <div class="nav-links-center">
      <a href="../admin/dashboard.html" data-page="dashboard">Dashboard</a>
      <a href="../admin/pacientes.html" data-page="pacientes">Pacientes</a>
      <a href="../admin/agendamentos.html" data-page="agendamentos">Agendamentos</a>
      <a href="../admin/mensagens.html" data-page="mensagens">Mensagens</a>
      <a href="../admin/relatorios.html" data-page="relatorios">Relatórios</a>
      <a href="../admin/financeiro.html" data-page="financeiro">Financeiro</a>
      <a href="../admin/perfil.html" data-page="perfil">Perfil</a>
    </div>

    <button class="btn-outline" onclick="logout()" style="padding: 0.6rem 1.5rem; font-size: 0.9rem;">Sair</button>
  </div>
</nav>

<script>
  // Marcar automaticamente o link ativo baseado na página atual
  (function() {
    const currentPath = window.location.pathname;
    const links = document.querySelectorAll('nav a');
    
    links.forEach(link => {
      const linkPath = link.getAttribute('href');
      const pageName = link.getAttribute('data-page');
      
      // Verificar se o link corresponde à página atual
      if (currentPath === linkPath || 
          currentPath.includes(pageName)) {
        link.classList.add('active');
      }
    });
    
    // Atualizar nome do utilizador
    const userData = JSON.parse(localStorage.getItem('user'));
    if (userData && userData.nome) {
      const userNameEl = document.getElementById('userName');
      if (userNameEl) {
        // Mostrar apenas primeiro nome após "Dra."
        const titulo = userData.genero === 'Feminino' ? 'Dra.' : 'Dr.';
        const primeiroNome = userData.primeiroNome || userData.nome.split(' ')[0];
        userNameEl.textContent = `${titulo} ${primeiroNome}`;
      }
    }
  })();
  
  // Função de logout
  function logout() {
    if (confirm('Tem certeza que deseja sair?')) {
      localStorage.removeItem('user');
      window.location.href = '../login.html';
    }
  }
</script>
