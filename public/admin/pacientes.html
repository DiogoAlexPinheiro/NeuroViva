<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes - Admin</title>
  <link rel="stylesheet" href="../admin/adds/admin.css">
  <link rel="stylesheet" href="../adds/modal.css">
  <script src="../admin/adds/loader.js"></script>
  <script src="../adds/modal.js"></script>
</head>
<body>
  <div id="header-container"></div>

  <main>
    <h2>Gestao de Pacientes</h2>

    <div class="card">
      <h3>Lista de Pacientes</h3>
      <div class="table-responsive" id="listaPacientes">
        <p class="pacientes-message">A carregar...</p>
      </div>
    </div>

    <div class="card">
      <div class="card-centered-content">
        <h3>Adicionar Novo Paciente</h3>
        <p class="card-description">Criar um novo perfil de paciente</p>
        <a href="../admin/novopaciente.html" class="btn">Criar Novo Paciente</a>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));

    if (!user || user.role !== 'admin') {
      window.location.href = '../login.html';
    }

    // Helper para não "quebrar" HTML quando mostramos mensagens (erros, etc.)
    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    const mq = window.matchMedia('(max-width: 768px)');
    let currentView = mq.matches ? 'mobile' : 'desktop';
    let servidorOnline = false;

    mq.addEventListener('change', (e) => {
      currentView = e.matches ? 'mobile' : 'desktop';
      // Só recarrega se o servidor já estiver confirmado online
      if (servidorOnline) carregarPacientes();
    });

    async function carregarPacientes() {
      const container = document.getElementById('listaPacientes');

      try {
        console.log('🔍 Iniciando carregamento de pacientes...');

        container.innerHTML = '<p class="pacientes-message">🔄 A carregar pacientes...</p>';

        const res = await fetch('http://localhost:3000/api/admin/pacientes');
        console.log('📡 Resposta recebida:', res.status);

        if (!res.ok) {
          throw new Error(`HTTP error! status: ${res.status}`);
        }

        const pacientes = await res.json();
        console.log('📋 Pacientes recebidos:', pacientes?.length ?? 0);

        if (!Array.isArray(pacientes) || pacientes.length === 0) {
          container.innerHTML = '<p class="pacientes-message">📭 Sem pacientes registados</p>';
          return;
        }

        // Filtrar pacientes válidos
        const pacientesValidos = pacientes.filter(p => p && p.nomeCompleto);

        if (pacientesValidos.length === 0) {
          container.innerHTML = '<p class="pacientes-message">⚠️ Sem pacientes válidos</p>';
          return;
        }

        // Ordenar: primeiro ativos, depois por nome
        pacientesValidos.sort((a, b) => {
          const estadoA = (a.estado || 'ativo').toLowerCase();
          const estadoB = (b.estado || 'ativo').toLowerCase();

          if (estadoA === 'ativo' && estadoB !== 'ativo') return -1;
          if (estadoA !== 'ativo' && estadoB === 'ativo') return 1;

          return a.nomeCompleto.localeCompare(b.nomeCompleto, 'pt');
        });

        console.log('✅ Pacientes ordenados:', pacientesValidos.map(p => `${p.nomeCompleto} (${p.estado})`));

        // Desktop: Tabela
        const tabelaHTML = `
          <table>
            <thead>
              <tr>
                <th>Foto</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Contacto</th>
                <th>Estado</th>
                <th>Acoes</th>
              </tr>
            </thead>
            <tbody>
              ${pacientesValidos.map(p => `
                <tr class="${(p.estado || 'ativo') === 'inativo' ? 'paciente-inativo' : ''}">
                  <td>
                    <img
                      src="${p.profileImage || '/assets/images/profiles/default.jpg'}"
                      alt="Foto ${escapeHtml(p.nomeCompleto)}"
                      class="profile-image"
                      width="60"
                      height="60"
                      loading="lazy"
                      decoding="async"
                      onerror="this.src='/assets/images/profiles/default.jpg'">
                  </td>
                  <td>${escapeHtml(p.nomeCompleto)}</td>
                  <td>${escapeHtml(p.email || 'N/A')}</td>
                  <td>${escapeHtml(p.contacto || '-')}</td>
                  <td><span class="badge ${(p.estado || 'ativo') === 'ativo' ? 'badge-success' : 'badge-danger'}">${escapeHtml(p.estado || 'ativo')}</span></td>
                  <td>
                    <a href="../admin/paciente-detalhes.html?nome=${encodeURIComponent(p.nomeCompleto)}" class="btn-small btn-solid">Ver Detalhes</a>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;

        // Mobile: Cards
        const cardsHTML = pacientesValidos.map(p => `
          <div class="mobile-card ${(p.estado || 'ativo') === 'inativo' ? 'inativo' : ''}">
            <div class="mobile-card-header">
              <img
                src="${p.profileImage || '/assets/images/profiles/default.jpg'}"
                alt="Foto ${escapeHtml(p.nomeCompleto)}"
                class="profile-image"
                width="60"
                height="60"
                loading="lazy"
                decoding="async"
                onerror="this.src='/assets/images/profiles/default.jpg'">
              <div>
                <h4 class="paciente-card-title">${escapeHtml(p.nomeCompleto)}</h4>
                <span class="badge ${(p.estado || 'ativo') === 'ativo' ? 'badge-success' : 'badge-danger'} paciente-card-badge">${escapeHtml(p.estado || 'ativo')}</span>
              </div>
            </div>
            <div class="mobile-card-body">
              <p><strong>Email:</strong> ${escapeHtml(p.email || 'N/A')}</p>
              <p><strong>Contacto:</strong> ${escapeHtml(p.contacto || '-')}</p>
            </div>
            <a href="../admin/paciente-detalhes.html?nome=${encodeURIComponent(p.nomeCompleto)}" class="btn-small btn-solid btn-fullwidth">Ver Detalhes</a>
          </div>
        `).join('');

        // Renderizar baseado na view atual
        container.innerHTML = (currentView === 'mobile') ? cardsHTML : tabelaHTML;

        console.log('✅ Renderização completa!');

      } catch (error) {
        console.error('❌ Erro ao carregar pacientes:', error);

        container.innerHTML = `
          <div class="pacientes-message-box pacientes-message-box--error">
            <p class="pacientes-message-title">❌ Erro ao carregar pacientes</p>
            <p class="pacientes-message-text">${escapeHtml(error.message)}</p>
            <button class="btn" onclick="carregarPacientes()">🔄 Tentar Novamente</button>
          </div>
        `;
      }
    }

    // Verificar se servidor está online
    async function verificarServidor() {
      const container = document.getElementById('listaPacientes');

      try {
        const res = await fetch('http://localhost:3000/api/estatisticas/publico');
        if (!res.ok) throw new Error('Servidor não responde');

        console.log('✅ Servidor online!');
        servidorOnline = true;
        carregarPacientes();
      } catch (error) {
        console.error('❌ Servidor offline:', error);
        servidorOnline = false;

        container.innerHTML = `
          <div class="pacientes-message-box pacientes-message-box--error">
            <p class="pacientes-message-title">🔌 Servidor desconectado</p>
            <p class="pacientes-message-text">Verifique se o servidor Node.js está a correr na porta 3000</p>
            <button class="btn" onclick="verificarServidor()">🔄 Tentar Novamente</button>
          </div>
        `;
      }
    }

    // Inicializar
    verificarServidor();
  </script>
</body>
</html>
